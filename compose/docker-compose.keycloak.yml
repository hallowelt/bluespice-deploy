services:

    keycloak:
      image: quay.io/keycloak/keycloak:latest
      container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-keycloak
      command: start
      restart: unless-stopped
      environment:
       - KC_HTTP_ENABLED=true
       - HTTP_ENABLED=true
       - KC_HOSTNAME=${WIKI_PROTOCOL}://${WIKI_HOST}/_auth
       - KC_HOSTNAME_STRICT=true
       - KC_HTTP_RELATIVE_PATH=/_auth
       - KC_HTTP_MANAGEMENT_RELATIVE_PATH=/_auth
       - KC_FEATURES=hostname:v2
       - KC_DB=mariadb
       - KC_DB_USERNAME=keycloak
       - KC_DB_PASSWORD=keycloakpassword
       - KC_DB_URL_HOST=${DB_HOST}
       - KC_DB_URL_PORT=3306
       - KC_DB_URL_DATABASE=keycloak
       - KC_HEALTH_ENABLED=true
       - KC_METRICS_ENABLED=true
       - KC_PROXY_ADDRESS_FORWARDING=true
       - KC_HOSTNAME_STRICT=false
       - KC_PROXY=edge
       - KEYCLOAK_CREATE_ADMIN_USER=true
       - KEYCLOAK_LOGLEVEL=DEBUG
       - KC_BOOTSTRAP_ADMIN_USERNAME=admin
       - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      depends_on:
        - database

    traefik-forward-auth:
     image: thomseddon/traefik-forward-auth:2
     container_name: ${COMPOSE_PROJECT_NAME:-bluespice}-traefik-forward-auth
     restart: unless-stopped
     environment:
       - DEFAULT_PROVIDER=oidc
       - PROVIDERS_OIDC_ISSUER_URL=https://${WIKI_HOST}/_auth/realms/master
       - PROVIDERS_OIDC_CLIENT_ID=<OICD-CLIENT_ID-FROM-KEYCLOAK>
       - PROVIDERS_OIDC_CLIENT_SECRET=<OICD-SECRET-FROM-KEYCLOAK>
       - SECRET=something-random
       - INSECURE_COOKIE=true
       - LOG_LEVEL=debug
       - LOGOUT_REDIRECT=https://${WIKI_HOST}/w
     depends_on:
       - keycloak
     labels:
       - "traefik.http.middlewares.traefik-forward-auth.forwardauth.address=http://traefik-forward-auth:4181"
       - "traefik.http.middlewares.traefik-forward-auth.forwardauth.authResponseHeaders=X-Forwarded-User"
       - "traefik.http.services.traefik-forward-auth.loadbalancer.server.port=4181"
