{{- if $.Values.statefulBackendServices.database.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: bluespice-database-secrets
  namespace: {{ default "default" $.Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: {{ $.Values.statefulBackendServices.database.secrets.MYSQL_ROOT_PASSWORD | b64enc | quote }}
  MYSQL_PASSWORD: {{ $.Values.statefulBackendServices.database.secrets.MYSQL_PASSWORD | b64enc | quote }}
{{- end }}
